<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tone fixture</title>
</head>
<body>
  <p>A test tab for tests/browser/capture.py: 440 Hz on the left and 1000 Hz on the right, for the given seconds, then silence.</p>
  <script>
    // Test fixture, not part of the page: free to hold numbers.
    window.play = (seconds) => {
      const ctx = new AudioContext({ sampleRate: 48000 });
      const merger = ctx.createChannelMerger(2);
      [[440, 0], [1000, 1]].forEach(([hz, channel]) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = hz;
        gain.gain.value = 0.4;
        osc.connect(gain).connect(merger, 0, channel);
        osc.start(ctx.currentTime + 0.1);
        osc.stop(ctx.currentTime + 0.1 + seconds);
      });
      merger.connect(ctx.destination);
      return ctx.resume().then(() => ctx.state);
    };
  </script>
</body>
</html>
