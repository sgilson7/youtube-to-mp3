<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Reference default. connect-src 'self' keeps fetches on this origin;
       'wasm-unsafe-eval' lets the page compile its own WebAssembly module;
       form-action 'none' blocks form posts. A meta policy cannot stop data
       leaving by navigation, so the browser check still watches requests.
       frame-src names the one origin the video player may load from, the
       core's player::ORIGIN; tests/player_fence.rs holds the two together. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self'; img-src 'self' data:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>YouTube to MP3</title>
  <!-- No icon file: an empty one stops the browser asking for /favicon.ico. -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body data-ready="false">
  <main>
    <h1 id="title"></h1>
    <div id="player"></div>
    <div id="panels"></div>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <noscript><p>This page needs JavaScript and WebAssembly to record and encode sound.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
